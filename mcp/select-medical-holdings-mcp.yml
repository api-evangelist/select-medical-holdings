caveats:
  - >-
    Every tool above touches PHI and requires SMART-on-FHIR patient authorization. There is no
    anonymous read path, so an MCP server over this endpoint could not be usefully public.
  - >-
    Write tools are deliberately omitted from this candidate list. The API supports create on 11
    resource types and update on 7, but declares no delete, no conditional create/update and no
    idempotency key — so an agent-driven write is unretryable and irreversible. See the
    reversibility block in conventions/select-medical-holdings-conventions.yml.
