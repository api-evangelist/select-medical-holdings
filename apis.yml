    name: Select Medical FHIR DSTU2 API
    description: >-
      Legacy HL7 FHIR DSTU2 (1.0.2) endpoint operated by Select Medical on the same Epic platform,
      registered as "Select Medical" in Epic's public DSTU2 endpoint directory since 2020-06-01 and
      still listed active. Retained for older certified applications; new integrations use the R4
      endpoint.
    humanURL: https://mychart.selectmedical.com/MyChart/signup
