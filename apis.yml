aid: select-medical-holdings
name: "Select Medical Holdings"
description: >-
  Select Medical Holdings Corporation is one of the largest operators of specialty hospitals and
  outpatient rehabilitation clinics in the United States, running critical illness recovery hospitals,
  inpatient rehabilitation hospitals, outpatient rehabilitation clinics and occupational health centers
  across the country. Select Medical is not a software vendor and publishes no commercial developer
  program, but as a covered healthcare provider running Epic it operates a live HL7 FHIR R4 patient-access
  API — registered under "Select Medical" in Epic's public endpoint directory — that exposes 59 FHIR
  resource types behind SMART-on-FHIR OAuth 2.0, together with an Epic MyChart patient portal. This
  profile documents that regulated interoperability surface rather than a commercial API product.
specificationVersion: '0.23'
