apis:
  - aid: select-medical-holdings:select-medical-holdings-fhir-r4
    name: Select Medical FHIR R4 API
    description: >-
      Live HL7 FHIR R4 (4.0.1) patient-access API operated by Select Medical on its Epic platform
      (community et0948, Epic software version November 2025). The server's own CapabilityStatement
      self-identifies as "Select Medical FHIR Server" and declares 59 resource types, 702 search
      parameters and 47 US Core 6.1.0 profiles, secured with SMART-on-FHIR OAuth 2.0. Registered as
      "Select Medical" in Epic's public endpoint directory since 2024-11-09.
    humanURL: https://mychart.selectmedical.com/MyChart/signup
    baseURL: https://epicproxy.et0948.epichosted.com/FhirProxy/api/FHIR/R4
    tags:
      - FHIR
