    - oauth2
    - openIdConnect
  oauth2_flows:
    - authorizationCode
    - clientCredentials
    - jwtBearer
    - refreshToken
  public_registration: false
  registration_note: >-
    App registration is not self-serve at Select Medical. Client IDs are issued through Epic's
    App Orchard / Vendor Services program and then activated by the health system, so an agent
    cannot obtain credentials from the endpoint alone.
schemes:
  - name: smartOnFhir
    type: oauth2
    standard: SMART App Launch (SMART on FHIR)
    description: >-
      SMART-on-FHIR OAuth 2.0. The CapabilityStatement advertises the authorize and token URIs via the
      standard SMART oauth-uris extension, and declares OAuth + SMART-on-FHIR under rest.security.service.
    flows:
      - flow: authorizationCode
        authorizationUrl: https://epicproxy.et0948.epichosted.com/FhirProxy/oauth2/authorize
        tokenUrl: https://epicproxy.et0948.epichosted.com/FhirProxy/oauth2/token
        pkce: true
        pkce_methods:
          - S256
      - flow: clientCredentials
        tokenUrl: https://epicproxy.et0948.epichosted.com/FhirProxy/oauth2/token
        note: Backend-services flow; requires asymmetric (private_key_jwt) client authentication.
      - flow: jwtBearer
        grant_type: urn:ietf:params:oauth:grant-type:jwt-bearer
        tokenUrl: https://epicproxy.et0948.epichosted.com/FhirProxy/oauth2/token
